stages:
  - build
  - deploy_aws

build_images:
  stage: build
  image: docker:29.4.1

  services:
    - docker:29.4.1-dind

  variables:
    DOCKER_TLS_CERTDIR: "/certs"

  before_script:
    - docker login -u $REGISTRY_USER -p $REGISTRY_PASS

  script:
    - docker build -t itallohmp/sgp-notifier:1.0 .
    - docker push itallohmp/sgp-notifier:1.0

